{% extends 'base.html' %}
{% block title %}Inscription — PrêtBancaire{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    <div class="card shadow-lg border-0 rounded-4">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <i class="bi bi-person-plus text-primary" style="font-size:2.5rem;"></i>
          <h2 class="fw-bold mt-2">Créer un compte</h2>
          <p class="text-muted">Rejoignez PrêtBancaire</p>
        </div>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Nom complet</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" name="name" class="form-control" placeholder="Jean Dupont" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" class="form-control" placeholder="votre@email.com" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Mot de passe</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" class="form-control" placeholder="Minimum 8 caractères" required minlength="8">
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Secteur d'activité</label>
            <select name="sector" class="form-select">
              <option value="prive">Secteur Privé</option>
              <option value="public">Secteur Public</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
            <i class="bi bi-person-check"></i> Créer mon compte
          </button>
        </form>
        <hr>
        <p class="text-center text-muted mb-0">
          Déjà inscrit ? <a href="{{ url_for('login') }}">Se connecter</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
